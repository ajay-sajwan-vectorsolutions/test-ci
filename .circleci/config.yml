            fi
      - run:
          name: Deploy to prod S3 latest folder
          command: |
            if [ -d "dist" ]; then
              # Iterate over all MFE directories in the dist folder
              for MFE_DIR in dist/*; do
                if [ -d "$MFE_DIR" ]; then
                  MFE_NAME=$(basename "$MFE_DIR")
                  echo "Deploying $MFE_NAME"

                  # Find the latest version folder in the current MFE directory
                  LATEST_VERSION_FOLDER=$(ls "$MFE_DIR" | sort -V | tail -n 1)
                  echo "Latest version folder name for $MFE_NAME: $LATEST_VERSION_FOLDER"

                  # Verify the latest version folder exists
                  if [ -d "$MFE_DIR/$LATEST_VERSION_FOLDER" ]; then
                    # Copy the contents of the latest version folder to the 'latest' folder in S3
                    aws s3 cp "$MFE_DIR/$LATEST_VERSION_FOLDER/" s3://vectorsolutions-web-components-prod/${CIRCLE_PROJECT_REPONAME}-mfe/$MFE_NAME/latest/ --recursive
                    echo "Deployed $MFE_NAME to prod S3 latest folder"
                  else
                    echo "Error: Latest version folder does not exist for $MFE_NAME!"
                  fi
                fi
              done
            else
              echo "No changed packages, skipping publish."
            fi
      - run:
          name: Upload importMap to prod S3
          command: |
            if git diff --name-only $CIRCLE_BRANCH origin/main | grep -q 'projects/importmap-prod.json'; then
              aws s3 cp ./projects/importmap-prod.json s3://vectorsolutions-web-components-prod/${CIRCLE_PROJECT_REPONAME}-mfe/importmap.json
            fi
            if git diff --name-only $CIRCLE_BRANCH origin/main | grep -q 'projects/3rd-party-importmap.json'; then  
              aws s3 cp ./projects/3rd-party-importmap.json s3://vectorsolutions-web-components-prod/${CIRCLE_PROJECT_REPONAME}-mfe/3rd-party-importmap.json
            fi
      - run:
          name: Upload configuration file to prod S3
          command: |
              aws s3 cp ./projects/singlespa-app-config.production.json s3://vectorsolutions-web-components-prod/${CIRCLE_PROJECT_REPONAME}-mfe/singlespa-app-config.json       
      - run:
          name: Invalidate Cloudfront-Dev
          command: |
            aws cloudfront create-invalidation --distribution-id E3NZTUCTOEL6J3  --paths "/${CIRCLE_PROJECT_REPONAME}-mfe/*"                             
